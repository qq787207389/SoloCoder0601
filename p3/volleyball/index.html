<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>热血排球 - Volleyball Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #gameCanvas {
      border: 4px solid #fff;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #aaa;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>🏐 热血排球 🏐</h1>
  </div>
  <canvas id="gameCanvas" width="960" height="640"></canvas>
  <div id="instructions">
    方向键/WASD: 移动 | 空格: 接球/托球/扣杀 | E: 必杀技 | 点击: 切换最近队员
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
