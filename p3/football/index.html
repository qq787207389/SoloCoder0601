<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热血足球 - 街头足球大乱斗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(255, 107, 107, 0.5);
            border: 4px solid #ff6b6b;
            border-radius: 8px;
        }
        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
        }
        .hidden {
            display: none !important;
        }
        #startScreen, #pauseScreen, #goalScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .title {
            font-size: 48px;
            color: #ff6b6b;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #ffd93d;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .menu-btn {
            background: linear-gradient(180deg, #ff6b6b 0%, #ee5a5a 100%);
            border: 3px solid #ffd93d;
            color: #fff;
            font-size: 20px;
            padding: 15px 40px;
            margin: 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .menu-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
        }
        .controls-info {
            color: #fff;
            font-size: 14px;
            margin-top: 30px;
            text-align: center;
            line-height: 2;
        }
        .team-select {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .team-card {
            padding: 20px;
            border: 3px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            pointer-events: auto;
        }
        .team-card:hover, .team-card.selected {
            border-color: #ffd93d;
            box-shadow: 0 0 15px rgba(255, 217, 61, 0.6);
        }
        .team-color {
            width: 80px;
            height: 60px;
            margin-bottom: 10px;
            border: 2px solid #000;
        }
        .team-name {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        #scoreBoard {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            font-size: 32px;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            z-index: 10;
        }
        .team-score {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .score-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px;
            border-radius: 5px;
        }
        #timer {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 18px;
            z-index: 10;
        }
        .stamina-bars {
            position: absolute;
            bottom: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }
        .stamina-bar {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stamina-label {
            color: #fff;
            font-size: 12px;
            width: 80px;
        }
        .stamina-fill {
            width: 100px;
            height: 10px;
            background: #333;
            border: 1px solid #fff;
        }
        .stamina-inner {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            transition: width 0.1s;
        }
        #weatherIndicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
        .goal-text {
            font-size: 72px;
            color: #ffd93d;
            text-shadow: 5px 5px 0 #ff6b6b;
            animation: goalAnim 0.5s ease-out;
        }
        @keyframes goalAnim {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .scorer-name {
            font-size: 24px;
            color: #fff;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1200" height="700"></canvas>
        <div id="ui">
            <div id="scoreBoard" class="hidden">
                <div class="team-score">
                    <div class="score-box" id="team1Name">红队</div>
                    <div class="score-box" id="score1">0</div>
                </div>
                <div class="team-score">
                    <div class="score-box" id="score2">0</div>
                    <div class="score-box" id="team2Name">蓝队</div>
                </div>
            </div>
            <div id="timer" class="hidden">3:00</div>
            <div id="weatherIndicator" class="hidden">☀️ 晴朗</div>
            <div class="stamina-bars hidden" id="staminaBars"></div>
        </div>
        <div id="startScreen">
            <div class="title">⚽ 热血足球 ⚽</div>
            <div style="color: #ffd93d; font-size: 18px; margin-bottom: 20px;">街头足球大乱斗</div>
            <div class="team-select">
                <div class="team-card selected" data-team="0">
                    <div class="team-color" style="background: linear-gradient(180deg, #ff6b6b 50%, #fff 50%);"></div>
                    <div class="team-name">火焰队</div>
                </div>
                <div class="team-card" data-team="1">
                    <div class="team-color" style="background: linear-gradient(180deg, #4ecdc4 50%, #fff 50%);"></div>
                    <div class="team-name">冰霜队</div>
                </div>
                <div class="team-card" data-team="2">
                    <div class="team-color" style="background: linear-gradient(180deg, #ffd93d 50%, #000 50%);"></div>
                    <div class="team-name">雷电队</div>
                </div>
                <div class="team-card" data-team="3">
                    <div class="team-color" style="background: linear-gradient(180deg, #a855f7 50%, #fff 50%);"></div>
                    <div class="team-name">暗影队</div>
                </div>
            </div>
            <div style="display: flex; gap: 20px; margin: 20px 0;">
                <button class="menu-btn" id="start2v2">2v2 对战</button>
                <button class="menu-btn" id="start4p">四人混战</button>
            </div>
            <div class="controls-info">
                <div style="color: #ffd93d; margin-bottom: 10px;">🎮 操作说明</div>
                <div>玩家1 (红队): WASD移动, J射门, K飞踹, L必杀技</div>
                <div>玩家2 (蓝队): 方向键移动, 1射门, 2飞踹, 3必杀技</div>
                <div>玩家3: TFHG移动, B射门, N飞踹, M必杀技</div>
                <div>玩家4: 8456移动, 7射门, 9飞踹, /必杀技</div>
                <div style="margin-top: 10px; color: #4ecdc4;">⚠️ 无规则！赢球就行！飞踹、铲球、道具随便用！</div>
            </div>
        </div>
        <div id="pauseScreen" class="hidden">
            <div class="title">暂停</div>
            <button class="menu-btn" id="resumeBtn">继续游戏</button>
            <button class="menu-btn" id="restartBtn">重新开始</button>
        </div>
        <div id="goalScreen" class="hidden">
            <div class="goal-text">GOAL!</div>
            <div class="scorer-name" id="goalScorer">进球者</div>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ball.js"></script>
    <script src="js/powerup.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/specialmove.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
